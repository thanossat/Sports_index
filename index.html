<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports_index Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 20px 40px;
            border-bottom: 2px solid #334155;
        }
        .header h1 {
            font-size: 28px;
            color: #38bdf8;
        }
        .header p {
            color: #94a3b8;
            margin-top: 5px;
        }
        .container {
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        .stat-card .value.positive { color: #4ade80; }
        .stat-card .value.negative { color: #f87171; }
        .stat-card .value.neutral { color: #38bdf8; }
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .table-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }
        .table-header h2 {
            font-size: 18px;
            color: #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover { background: #334155; }
        td { font-size: 14px; }
        .win { color: #4ade80; font-weight: 600; }
        .loss { color: #f87171; font-weight: 600; }
        .pending { color: #fbbf24; font-weight: 600; }
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        .error {
            background: #451a1a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎾 Sports_index Dashboard</h1>
        <p>Tennis Bot Stats • Auto-refresh every 6h</p>
    </div>
    
    <div class="container">
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <h3>Συνολικά Bets</h3>
                <div class="value neutral" id="total-bets">-</div>
            </div>
            <div class="stat-card">
                <h3>Win Rate</h3>
                <div class="value neutral" id="win-rate">-</div>
            </div>
            <div class="stat-card">
                <h3>Wins</h3>
                <div class="value positive" id="wins">-</div>
            </div>
            <div class="stat-card">
                <h3>Losses</h3>
                <div class="value negative" id="losses">-</div>
            </div>
        </div>
        
        <div class="table-container">
            <div class="table-header">
                <h2>📊 Monthly Summary</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Έτος</th>
                        <th>Μήνας</th>
                        <th>Bets</th>
                        <th>Wins</th>
                        <th>Losses</th>
                        <th>Win Rate</th>
                    </tr>
                </thead>
                <tbody id="monthly-tbody">
                    <tr><td colspan="6" class="loading">Φόρτωση...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="table-container">
            <div class="table-header">
                <h2>📝 Όλα τα Bets</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Ημερομηνία</th>
                        <th>Αγώνας</th>
                        <th>Pick</th>
                        <th>Main Stake</th>
                        <th>Cover Stake</th>
                        <th>Conf</th>
                        <th>Αποτέλεσμα</th>
                        <th>Games</th>
                    </tr>
                </thead>
                <tbody id="bets-tbody">
                    <tr><td colspan="8" class="loading">Φόρτωση...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sb = supabase.createClient(
            'https://gxvvvlxcvzkphvsmgjhl.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dnZ2bHhjdnprcGh2c21namhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDEwNDYsImV4cCI6MjEwMDkxNzA0Nn0.Mkt-RXoDQdtvMgwX9WwgyQcE63DbFJrh22G1cKkjGdA'
        );

        async function loadData() {
            try {
                const { data, error } = await sb.from('tennis_bets').select('*').order('match_date', { ascending: false });
                
                if (error) throw error;
                
                renderStats(data);
                renderMonthly(data);
                renderBets(data);
                
            } catch (err) {
                document.getElementById('monthly-tbody').innerHTML = 
                    `<tr><td colspan="6" class="error">❌ Σφάλμα: ${err.message}</td></tr>`;
                document.getElementById('bets-tbody').innerHTML = 
                    `<tr><td colspan="8" class="error">❌ Σφάλμα: ${err.message}</td></tr>`;
            }
        }

        function renderStats(bets) {
            const total = bets.length;
            const wins = bets.filter(b => b.result === 'WIN').length;
            const losses = bets.filter(b => b.result === 'LOSS').length;
            const winRate = total > 0 ? ((wins / (wins + losses)) * 100).toFixed(1) : 0;
            
            document.getElementById('total-bets').textContent = total;
            document.getElementById('win-rate').textContent = winRate + '%';
            document.getElementById('wins').textContent = wins;
            document.getElementById('losses').textContent = losses;
        }

        function renderMonthly(bets) {
            const groups = {};
            bets.forEach(bet => {
                const d = new Date(bet.match_date);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                if (!groups[key]) groups[key] = { year: d.getFullYear(), month: d.getMonth()+1, bets: 0, wins: 0, losses: 0 };
                groups[key].bets++;
                if (bet.result === 'WIN') groups[key].wins++;
                if (bet.result === 'LOSS') groups[key].losses++;
            });
            
            const sorted = Object.keys(groups).sort().reverse();
            const monthNames = ['','Ιαν','Φεβ','Μαρ','Απρ','Μαι','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
            
            let html = '';
            sorted.forEach(key => {
                const g = groups[key];
                const rate = g.bets > 0 ? ((g.wins / (g.wins + g.losses)) * 100).toFixed(1) : 0;
                html += `<tr>
                    <td>${g.year}</td>
                    <td>${monthNames[g.month]}</td>
                    <td>${g.bets}</td>
                    <td class="win">${g.wins}</td>
                    <td class="loss">${g.losses}</td>
                    <td>${rate}%</td>
                </tr>`;
            });
            
            document.getElementById('monthly-tbody').innerHTML = html || '<tr><td colspan="6" style="text-align:center;padding:40px;">Δεν υπάρχουν δεδομένα</td></tr>';
        }

        function renderBets(bets) {
            let html = '';
            bets.forEach(bet => {
                const cls = bet.result === 'WIN' ? 'win' : (bet.result === 'LOSS' ? 'loss' : 'pending');
                html += `<tr>
                    <td>${bet.match_date}</td>
                    <td>${bet.player1} vs ${bet.player2}</td>
                    <td>${bet.selected_pick || '-'}</td>
                    <td>€${bet.main_stake || '0.00'}</td>
                    <td>€${bet.cover_stake || '0.00'}</td>
                    <td>${bet.confidence || '-'}/10</td>
                    <td class="${cls}">${bet.result || 'PENDING'}</td>
                    <td>${bet.actual_games || '-'}</td>
                </tr>`;
            });
            document.getElementById('bets-tbody').innerHTML = html || '<tr><td colspan="8" style="text-align:center;padding:40px;">Δεν υπάρχουν δεδομένα</td></tr>';
        }

        loadData();
        setInterval(loadData, 21600000); // Refresh every 6 hours
    </script>
</body>
</html>
